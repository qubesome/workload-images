name: build-images

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions: {}

env: 
  REGISTRY: ghcr.io/${{ github.repository }}
  TAG: smoke-test

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      
      # Only the images affected by the changes are built, along with the
      # images they are built on. Workloads marked .local are never built here.
      - name: Build affected images
        run: |
          make build-affected
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}

      - name: Smoke test binaries
        run: |
          smoke() {
            image="${REGISTRY}/$1:${TAG}"
            shift

            if ! docker image inspect "${image}" > /dev/null 2>&1; then
              echo "skipping ${image}, not affected by this change"
              return
            fi

            docker run "${image}" "$@"
          }

          smoke xorg awesome --version
          smoke xorg i3 --version
          smoke code code --version
          smoke chrome google-chrome --version
          smoke vivaldi vivaldi --version
